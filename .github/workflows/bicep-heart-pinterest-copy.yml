name: One-time Bicep Heart Pinterest copy update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bicep-heart-pinterest-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Required: same serialized lock as the existing Sapiver Prints publisher,
# since Pinterest continuous refresh-token rotation is single writer.
concurrency:
  group: sapiver-pinterest-token-rotation
  cancel-in-progress: false

jobs:
  update-exact-three-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/post-sapiver-prints.mjs
            scripts/update-bicep-heart-pin-copy.mjs
            test/update-bicep-heart-pin-copy.test.mjs
            social/sapiver-prints/pinterest-receipts.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact Pin-ID, direct Etsy link and no-new-Pin contracts
        run: |
          node --check scripts/update-bicep-heart-pin-copy.mjs
          node --test test/update-bicep-heart-pin-copy.test.mjs

      - name: Update title, description and alt text on ONLY three Bicep Heart Pins
        id: copy
        env:
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_OUT: ${{ runner.temp }}/bicep-pinterest-refresh.txt
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
        run: node scripts/update-bicep-heart-pin-copy.mjs

      - name: Persist rotated Pinterest refresh credential securely
        if: always()
        id: rotate
        env:
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          ROTATED_FILE: ${{ runner.temp }}/bicep-pinterest-refresh.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ROTATED_FILE" ]; then
            echo "No token rotation took place."
            exit 0
          fi
          test -n "$GH_TOKEN"
          token="$(tr -d '\r\n' < "$ROTATED_FILE")"
          [[ "$token" == pinr* ]]
          printf '%s' "$token" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          unset token
          rm -f "$ROTATED_FILE"
          echo "Pinterest refresh credential rotated."

      - name: Require confirmed Pinterest metadata update and token rotation
        if: always() && (steps.copy.outcome != 'success' || steps.rotate.outcome != 'success')
        run: exit 1
