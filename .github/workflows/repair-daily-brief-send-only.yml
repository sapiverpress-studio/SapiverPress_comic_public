name: Repair SEND-only Daily Brief Resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-daily-brief-send-only.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Repair resolver escaping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/daily-brief-social-bridge.yml')
          text = p.read_text()
          old = text
          text = text.replace(r'/^\\d{4}-\\d{2}-\\d{2}$/.test(entry.name)', r'/^\d{4}-\d{2}-\d{2}$/.test(entry.name)')
          text = text.replace(r'`EDITION_DATE=${selected.date}\\nCANDIDATE_ID=${selected.candidate}\\nSOURCE_SHA=${sourceSha}\\n`', r'`EDITION_DATE=${selected.date}\nCANDIDATE_ID=${selected.candidate}\nSOURCE_SHA=${sourceSha}\n`')
          text = text.replace(r'`edition_date=${selected.date}\\ncandidate_id=${selected.candidate}\\nsource_sha=${sourceSha}\\n`', r'`edition_date=${selected.date}\ncandidate_id=${selected.candidate}\nsource_sha=${sourceSha}\n`')
          text = text.replace(r'`Newest fully released edition: ${selected.date} (${selected.candidate.slice(0, 12)}…)\\n`', r'`Newest fully released edition: ${selected.date} (${selected.candidate.slice(0, 12)}…)\n`')
          if text == old:
              raise SystemExit('Expected over-escaped resolver strings were not found; refusing a blind edit.')
          p.write_text(text)
          PY
          grep -F '.filter(entry => entry.isDirectory() && /^\d{4}-\d{2}-\d{2}$/.test(entry.name))' .github/workflows/daily-brief-social-bridge.yml
          git diff --check
          git diff -- .github/workflows/daily-brief-social-bridge.yml
      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sapiver-social-bridge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/daily-brief-social-bridge.yml
          git commit -m 'Fix SEND-only Daily Brief release resolver'
          git push origin HEAD:main
      - name: Dispatch corrected SEND-only social release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run daily-brief-social-bridge.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm=SEND
          echo 'Dispatched corrected Daily Brief social release with SEND.'
