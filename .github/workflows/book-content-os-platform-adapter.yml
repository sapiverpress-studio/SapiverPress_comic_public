name: Book Content OS Platform Adapter

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-platform-adapted-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "DATE_OVERRIDE=${{ github.event.inputs.date_override }}" >> "$GITHUB_ENV"
          else
            echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Build platform-native Book Content OS copy pack
        run: node scripts/build-book-content-os-platform-adapter.mjs

      - name: Commit generated platform adapter outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/book-content-os
          if git diff --cached --quiet; then
            echo "No Book Content OS platform adapter changes to commit."
          else
            git commit -m "Build Book Content OS platform adapter copy for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
              git pull --rebase origin main
            done
            git push
          fi
