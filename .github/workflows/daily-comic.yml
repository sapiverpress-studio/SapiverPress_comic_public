name: Sapiver Press Daily Comic Engine V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-comic.yml"
      - "scripts/**"
      - "config/**"
      - "package.json"
  schedule:
    - cron: "15 7 * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional YYYY-MM-DD test date"
        required: false
        default: ""
      run_archive:
        description: "Run archive migration too"
        required: false
        default: "false"
      post_to_facebook:
        description: "Try Facebook post after generation"
        required: false
        default: "true"
      force_facebook_post:
        description: "Force Facebook post even if state says already posted"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sapiver-press-daily-comic
  cancel-in-progress: false

jobs:
  generate-daily-story:
    name: Generate Daily Story
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '15 7 * * *'
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Validate project
        run: npm run validate
      - name: Run daily generator
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run daily
      - name: Post comic to Facebook
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.post_to_facebook == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          COMIC_POST_IMAGE_URL_TEMPLATE: ${{ secrets.COMIC_POST_IMAGE_URL_TEMPLATE }}
          COMIC_POST_IMAGE_PATH: ${{ secrets.COMIC_POST_IMAGE_PATH }}
          FORCE_FB_POST: ${{ github.event.inputs.force_facebook_post }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          ETSY_CATALOG_URL: "https://sapiver-press-etsy-search-catalog.netlify.app/"
        run: npm run facebook-post
      - name: Commit Facebook post state
        if: always()
        run: |
          set -e
          git config user.name "sapiver-comic-bot"
          git config user.email "sapiver-comic-bot@users.noreply.github.com"
          if [ ! -f facebook-posts.json ]; then
            echo "No Facebook state file to commit"
            exit 0
          fi
          cp facebook-posts.json /tmp/facebook-posts.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/facebook-posts.json facebook-posts.json
          git add facebook-posts.json
          if git diff --cached --quiet; then
            echo "No Facebook state changes"
            exit 0
          fi
          git commit -m "Update Facebook posting state"
          git push

  archive-migration:
    name: Archive Migration
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * 1' || github.event.inputs.run_archive == 'true'
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run archive migration
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run archive
