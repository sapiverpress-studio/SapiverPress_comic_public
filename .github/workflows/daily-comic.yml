name: Sapiver Press Daily Comic Engine V3

on:
  schedule:
    # Daily weekday story at 07:00 UTC
    - cron: "0 7 * * 1-5"
    # Weekly archive migration every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional YYYY-MM-DD test date"
        required: false
        default: ""
      run_archive:
        description: "Run archive migration too"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate-daily-story:
    name: Generate Daily Story
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1-5'

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run validate

      - name: Run daily generator
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run daily

  archive-migration:
    name: Archive Migration
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * 1' || github.event.inputs.run_archive == 'true'

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run archive migration
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
        run: npm run archive
