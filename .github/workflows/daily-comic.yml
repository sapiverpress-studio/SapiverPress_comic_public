name: Sapiver Press Daily Comic Engine V3

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional YYYY-MM-DD test date"
        required: false
        default: ""
      run_archive:
        description: "Run archive migration too"
        required: false
        default: "false"
      polish_images_openai:
        description: "Use OpenAI to polish background signs/books/branding before composition"
        required: false
        default: "false"
      supporting_life_trigger:
        description: "Supporting-life trigger mode: auto, force, or off"
        required: false
        default: "auto"
      force_paid_api_run:
        description: "Override spend guard and allow paid API calls outside posting window"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sapiver-press-daily-comic
  cancel-in-progress: true

jobs:
  generate-daily-preview:
    name: Generate Daily Preview Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check paid API spend guard
        id: api_guard
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          POST_TO_FACEBOOK: "false"
          POST_TO_PINTEREST: "false"
          FORCE_GENERATE_IMAGES: ${{ github.event.inputs.force_paid_api_run }}
          IMAGE_GENERATION_WINDOW_START: "07:00"
          IMAGE_GENERATION_WINDOW_END: "08:30"
        run: node scripts/should-generate-images.mjs

      - name: Stop before paid APIs
        if: steps.api_guard.outputs.generate_images != 'true'
        run: |
          echo "Paid API guard blocked this run."
          echo "Reason: ${{ steps.api_guard.outputs.image_generation_reason }}"
          echo "No OpenAI, Anthropic, Gemini, fal.ai, ElevenLabs, Facebook, or Pinterest calls will run."

      - name: Install dependencies
        if: steps.api_guard.outputs.generate_images == 'true'
        run: npm install

      - name: Install Chromium for compositor
        if: steps.api_guard.outputs.generate_images == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate project
        if: steps.api_guard.outputs.generate_images == 'true'
        run: npm run validate

      - name: Capture today's puzzle before story generation
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run capture:today

      - name: Run daily generator
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: "claude-sonnet-4-5-20250929"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUPPORTING_LIFE_TRIGGER: ${{ github.event.inputs.supporting_life_trigger }}
        run: npm run daily

      - name: Humanise storyboard with Gemini
        if: steps.api_guard.outputs.generate_images == 'true'
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: node scripts/humanise-storyboard-gemini.mjs

      - name: Lint final storyboard copy
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: node scripts/lint-final-storyboard-copy.mjs

      - name: Generate routed art prompt pack
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          FAL_MODEL: "fal-ai/z-image/turbo/lora"
          HF_LORA_TRIGGER: "Isla_v2"
          HF_LORA_FILE: "Isla_v2_1780410778059.safetensors"
          HF_NUM_INFERENCE_STEPS: "9"
          FAL_NUM_INFERENCE_STEPS: "9"
          HF_LORA_SCALE: "1"
          FAL_LORA_SCALE: "1"
          HF_IMAGE_WIDTH: "1024"
          HF_IMAGE_HEIGHT: "1024"
          FAL_IMAGE_WIDTH: "1024"
          FAL_IMAGE_HEIGHT: "1024"
        run: |
          npm run art-prompts
          node scripts/resolve-image-model-profile.mjs

      - name: Generate Isla panel images
        if: steps.api_guard.outputs.generate_images == 'true'
        continue-on-error: true
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_MODEL: "fal-ai/z-image/turbo/lora"
          HF_LORA_TRIGGER: "Isla_v2"
          HF_LORA_FILE: "Isla_v2_1780410778059.safetensors"
          HF_NUM_INFERENCE_STEPS: "9"
          FAL_NUM_INFERENCE_STEPS: "9"
          HF_LORA_SCALE: "1"
          FAL_LORA_SCALE: "1"
          HF_IMAGE_WIDTH: "1024"
          HF_IMAGE_HEIGHT: "1024"
          FAL_IMAGE_WIDTH: "1024"
          FAL_IMAGE_HEIGHT: "1024"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run generate-images

      - name: Validate generated panel set before compose
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: node scripts/validate-generated-panel-set.mjs

      - name: Polish generated images with OpenAI
        if: steps.api_guard.outputs.generate_images == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_POLISH_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.polish_images_openai || 'false' }}
          OPENAI_IMAGE_MODEL: "gpt-image-1"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run polish-images

      - name: Compose preview PNG set
        if: steps.api_guard.outputs.generate_images == 'true'
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          COMIC_SCREEN_BOX: ${{ secrets.COMIC_SCREEN_BOX }}
        run: npm run compose

      - name: Upload preview assets
        if: steps.api_guard.outputs.generate_images == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-isla-preview-${{ github.run_number }}
          path: |
            daily/*.json
            latest.json
            image-manifests/*.json
            social/*/*.png
            social/*/manifest.json
            art-prompts/**/*
            captures/**/*
            art-replacements/*/generated-panel-validation.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Commit generated preview outputs
        if: steps.api_guard.outputs.generate_images == 'true'
        run: |
          set -e
          git config user.name "sapiver-comic-bot"
          git config user.email "sapiver-comic-bot@users.noreply.github.com"
          git checkout -- package-lock.json || true

          echo "Changed files before filtering:"
          git status --porcelain || true

          non_zip_changes=$(git status --porcelain | awk '$2 !~ /^social\/.*\.zip$/ {print $0}')
          zip_only_changes=$(git status --porcelain | awk '$2 ~ /^social\/.*\.zip$/ {print $2}')
          if [ -z "$non_zip_changes" ] && [ -n "$zip_only_changes" ]; then
            echo "Only social ZIP bytes changed. Discarding ZIP-only churn so the folder timestamp does not imply a visual update."
            for f in $zip_only_changes; do
              git checkout -- "$f" || true
            done
          fi

          git add characters/isla.json characters/isla_life_canon.json daily image-manifests latest.json social art-prompts art-replacements captures || true
          if git diff --cached --quiet; then
            echo "No generated preview changes"
          else
            git commit -m "Update daily comic preview assets"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "git push failed on attempt ${attempt}; rebasing with autostash and retrying"
              sleep 8
              git pull --rebase --autostash origin main || true
            done
          fi

      - name: Run archive migration
        if: steps.api_guard.outputs.generate_images == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.run_archive == 'true'
        run: npm run archive
