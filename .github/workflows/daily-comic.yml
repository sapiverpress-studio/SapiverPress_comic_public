name: Sapiver Press Daily Comic Engine V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-comic.yml"
      - "scripts/**"
      - "config/**"
      - "package.json"
  schedule:
    - cron: "15 7 * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional YYYY-MM-DD test date"
        required: false
        default: ""
      run_archive:
        description: "Run archive migration too"
        required: false
        default: "false"
      post_to_facebook:
        description: "Try Facebook post after generation"
        required: false
        default: "false"
      force_facebook_post:
        description: "Force Facebook post even if state says already posted"
        required: false
        default: "false"
      post_to_pinterest:
        description: "Try Pinterest post after generation"
        required: false
        default: "false"
      force_pinterest_post:
        description: "Force Pinterest post even if state says already posted"
        required: false
        default: "false"
      polish_images_openai:
        description: "Use OpenAI to polish background signs/books/branding before composition"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sapiver-press-daily-comic
  cancel-in-progress: true

jobs:
  generate-daily-story:
    name: Generate Daily Story
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '15 7 * * *'
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium for compositor
        run: npx playwright install --with-deps chromium
      - name: Validate project
        run: npm run validate
      - name: Capture today's puzzle before story generation
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run capture:today
      - name: Run daily generator
        env:
          COMIC_GITHUB_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: "claude-sonnet-4-5-20250929"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run daily
      - name: Humanise storyboard with Gemini
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: node scripts/humanise-storyboard-gemini.mjs
      - name: Lint final storyboard copy
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: node scripts/lint-final-storyboard-copy.mjs
      - name: Generate Phase 3 art prompt pack
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
        run: npm run art-prompts
      - name: Generate Isla panel images
        continue-on-error: true
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_LORA_TRIGGER: "ISLA_SP"
          FAL_MODEL: "fal-ai/z-image/turbo/lora"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run generate-images
      - name: Polish generated images with OpenAI
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_POLISH_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.polish_images_openai || 'false' }}
          OPENAI_IMAGE_MODEL: "gpt-image-1"
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: npm run polish-images
      - name: Compose full strip and close-ups
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          COMIC_SCREEN_BOX: ${{ secrets.COMIC_SCREEN_BOX }}
        run: npm run compose
      - name: Generate short video script
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ELEVENLABS_VOICE_NAME: "Isla Sterling"
          ELEVENLABS_VOICE_ID: "qSR2T7SqN7Pcd0YpO3Vd"
        run: npm run short-video-script
      - name: Generate short video voiceover
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          ISLA_ELEVEN: ${{ secrets.ISLA_ELEVEN }}
          ELEVENLABS_VOICE_NAME: "Isla Sterling"
          ELEVENLABS_VOICE_ID: "qSR2T7SqN7Pcd0YpO3Vd"
          ELEVENLABS_MODEL_ID: "eleven_multilingual_v2"
        run: npm run short-video-voice
      - name: Build short video MP4
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          ETSY_URL: "https://sapiverpress.etsy.com?coupon=SAVE20"
        run: npm run short-video-build
      - name: Upload daily video and TikTok copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-isla-daily-video-${{ github.run_number }}
          path: |
            social/*/short-video/*.mp4
            social/*/short-video/tiktok-post.txt
            social/*/short-video/tiktok-post.json
            social/*/short-video/script.txt
            social/*/short-video/caption.txt
            social/*/short-video/narration.json
            social/*/short-video/manifest.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Post comic to Facebook
        if: github.event_name == 'schedule' || github.event.inputs.post_to_facebook == 'true'
        continue-on-error: true
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID || secrets.META_PAGE_ID || secrets.PAGE_ID || secrets.FACEBOOK_ID || secrets.FB_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || secrets.FACEBOOK_PAGE_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN || secrets.PAGE_ACCESS_TOKEN || secrets.META_PAGE_TOKEN || secrets.META_PAGE_ACCESS_TOKEN }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN || secrets.META_ACCESS_TOKEN || secrets.FACEBOOK_USER_TOKEN || secrets.FB_USER_TOKEN || secrets.USER_ACCESS_TOKEN }}
          FB_GENERIC_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          FB_GRAPH_VERSION: "v24.0"
          FB_POST_STRICT: "1"
          COMIC_POST_IMAGE_PATH: "social/{date}.png"
          FORCE_FB_POST: ${{ github.event.inputs.force_facebook_post }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
          ETSY_CATALOG_URL: "https://sapiver-press-etsy-search-catalog.netlify.app/"
        run: npm run facebook-post
      - name: Commit generated story, prompts, social outputs and Facebook state
        if: always()
        run: |
          set -e
          git config user.name "sapiver-comic-bot"
          git config user.email "sapiver-comic-bot@users.noreply.github.com"
          git checkout -- package-lock.json || true

          echo "Changed files before filtering:"
          git status --porcelain || true

          non_zip_changes=$(git status --porcelain | awk '$2 !~ /^social\/.*\.zip$/ {print $0}')
          zip_only_changes=$(git status --porcelain | awk '$2 ~ /^social\/.*\.zip$/ {print $2}')
          if [ -z "$non_zip_changes" ] && [ -n "$zip_only_changes" ]; then
            echo "Only social ZIP bytes changed. Discarding ZIP-only churn so the folder timestamp does not imply a visual update."
            for f in $zip_only_changes; do
              git checkout -- "$f" || true
            done
          fi

          git add characters/isla.json characters/isla_life_canon.json daily image-manifests latest.json social art-prompts art-replacements captures || true
          if [ -f facebook-posts.json ]; then
            git add facebook-posts.json
          fi
          if git diff --cached --quiet; then
            echo "No generated story, prompt, social or Facebook state changes"
          else
            git commit -m "Update daily comic story, prompts, social and video outputs"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "git push failed on attempt ${attempt}; rebasing with autostash and retrying"
              sleep 8
              git pull --rebase --autostash origin main || true
            done
          fi
      - name: Post comic to Pinterest
        if: always() && (github.event_name == 'schedule' || github.event.inputs.post_to_pinterest == 'true')
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: "Sapiver Press Comic"
          PINTEREST_IMAGE_NAME: "00_start-grid.png"
          FORCE_PINTEREST_POST: ${{ github.event.inputs.force_pinterest_post }}
          SUITE_URL: "https://suite.sapiverpress.co.uk"
        run: node scripts/pinterest-post.mjs
      - name: Commit Pinterest state
        if: always() && (github.event_name == 'schedule' || github.event.inputs.post_to_pinterest == 'true')
        run: |
          set -e
          git config user.name "sapiver-comic-bot"
          git config user.email "sapiver-comic-bot@users.noreply.github.com"
          git add pinterest-posts.json social || true
          if git diff --cached --quiet; then
            echo "No Pinterest state changes"
          else
            git commit -m "Update Pinterest comic post state"
            git push || true
          fi
