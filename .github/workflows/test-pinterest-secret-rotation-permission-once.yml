name: Test Pinterest Secret Rotation Permission Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-pinterest-secret-rotation-permission-once.yml'

permissions:
  contents: read

jobs:
  test-secret-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
    steps:
      - name: Verify repository secret write permission without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'COMIC_GITHUB_TOKEN is unavailable.' >&2; exit 1; }
          value="pinterest-secret-write-test-${GITHUB_RUN_ID}"
          printf '%s' "$value" | gh secret set PINTEREST_SECRET_WRITE_TEST --repo "$GITHUB_REPOSITORY"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^PINTEREST_SECRET_WRITE_TEST'
          gh secret delete PINTEREST_SECRET_WRITE_TEST --repo "$GITHUB_REPOSITORY"
          echo 'PINTEREST_SECRET_ROTATION_PERMISSION=ok'
