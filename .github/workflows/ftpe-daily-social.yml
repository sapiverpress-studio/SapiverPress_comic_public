name: FTPE Daily Social

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override YYYY-MM-DD"
        required: false
        default: ""
      platform:
        description: "all, pinterest, facebook, or tiktok"
        required: false
        default: "all"
      post_mode:
        description: "dry_run or live"
        required: false
        default: "dry_run"
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: write

jobs:
  build-ftpe-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "DATE_OVERRIDE=${{ github.event.inputs.date_override }}" >> "$GITHUB_ENV"
          else
            echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          fi
          echo "FTPE_SOCIAL_PLATFORM=${{ github.event.inputs.platform || 'all' }}" >> "$GITHUB_ENV"
          echo "FTPE_SOCIAL_POST_MODE=${{ github.event.inputs.post_mode || 'dry_run' }}" >> "$GITHUB_ENV"

      - name: Build FTPE daily social assets
        run: node scripts/build-ftpe-daily-social.mjs

      - name: Prepare FTPE post records
        run: node scripts/post-ftpe-social.mjs

      - name: Commit generated FTPE social outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/ftpe
          if git diff --cached --quiet; then
            echo "No FTPE social output changes to commit."
          else
            git commit -m "Build FTPE social assets for ${DATE_OVERRIDE}"
            git push
          fi
