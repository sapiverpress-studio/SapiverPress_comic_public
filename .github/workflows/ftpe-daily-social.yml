name: FTPE Daily Social

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override YYYY-MM-DD"
        required: false
        default: ""
      post_mode:
        description: "live or dry_run"
        required: false
        default: "live"
  schedule:
    - cron: "15 8 * * *"
  push:
    paths:
      - ".github/workflows/ftpe-daily-social.yml"
      - "scripts/build-ftpe-pin-and-fb-carousel.mjs"
      - "scripts/post-ftpe-pin-and-fb-carousel.mjs"
      - "scripts/post-ftpe-pinterest-video.mjs"
      - "scripts/post-ftpe-youtube-short.mjs"

permissions:
  contents: write

jobs:
  build-and-post-ftpe-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "DATE_OVERRIDE=${{ github.event.inputs.date_override }}" >> "$GITHUB_ENV"
          else
            echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "FTPE_SOCIAL_POST_MODE=live" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FTPE_SOCIAL_POST_MODE=${{ github.event.inputs.post_mode || 'live' }}" >> "$GITHUB_ENV"
          else
            echo "FTPE_SOCIAL_POST_MODE=dry_run" >> "$GITHUB_ENV"
          fi

      - name: Pull FTPE advertising assets from shared Google Drive
        shell: bash
        env:
          FTPE_SOCIAL_DRIVE_FILE_ID: "17Qbd8Q6xICtKvpV0ZWtUuXv94nBWrXbc"
        run: |
          set -euo pipefail
          mkdir -p assets/ftpe/social_master assets/ftpe/social_sets assets/ftpe/bonus_sets

          if find assets/ftpe/social_master assets/ftpe/social_sets assets/ftpe/bonus_sets -type f \( -iname '*.png' -o -iname '*.zip' -o -iname '*.zip.b64' \) 2>/dev/null | grep -q .; then
            echo "FTPE social assets already present in this runner workspace."
            exit 0
          fi

          echo "Downloading FTPE social asset bundle from shared Google Drive file ${FTPE_SOCIAL_DRIVE_FILE_ID}."
          TMP_DIR="$(mktemp -d)"
          COOKIE_FILE="${TMP_DIR}/cookies.txt"
          FIRST_RESPONSE="${TMP_DIR}/drive-first-response"
          ASSET_ZIP="${TMP_DIR}/ftpe-drive-assets.zip"
          EXTRACT_DIR="${TMP_DIR}/extract"

          curl -L --fail --retry 3 -c "$COOKIE_FILE" \
            "https://drive.google.com/uc?export=download&id=${FTPE_SOCIAL_DRIVE_FILE_ID}" \
            -o "$FIRST_RESPONSE"

          CONFIRM_TOKEN="$(grep -oE 'confirm=([0-9A-Za-z_-]+)' "$FIRST_RESPONSE" | head -n 1 | cut -d= -f2 || true)"
          if [ -n "$CONFIRM_TOKEN" ]; then
            echo "Google Drive confirmation token detected; downloading confirmed file."
            curl -L --fail --retry 3 -b "$COOKIE_FILE" \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM_TOKEN}&id=${FTPE_SOCIAL_DRIVE_FILE_ID}" \
              -o "$ASSET_ZIP"
          else
            mv "$FIRST_RESPONSE" "$ASSET_ZIP"
          fi

          if ! unzip -t "$ASSET_ZIP" >/tmp/ftpe-social-unzip-test.txt 2>&1; then
            echo "Google Drive download did not produce a valid ZIP. First 500 bytes follow:"
            head -c 500 "$ASSET_ZIP" || true
            echo ""
            cat /tmp/ftpe-social-unzip-test.txt || true
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ASSET_ZIP" -d "$EXTRACT_DIR"

          DIRECT_PNG_COUNT="$(find "$EXTRACT_DIR" -type f -iname '*.png' | wc -l | tr -d ' ')"
          NESTED_ZIP_COUNT="$(find "$EXTRACT_DIR" -type f \( -iname '*.zip' -o -iname '*.zip.b64' \) | wc -l | tr -d ' ')"

          if [ "$NESTED_ZIP_COUNT" -gt 0 ]; then
            echo "Repo-ready or nested ZIP bundle detected; copying nested ZIP sets into assets/ftpe/."
            while IFS= read -r nested; do
              name="$(basename "$nested")"
              case "$name" in
                UK_Publishing_Admin_Starter_Guide_PNGs.zip|UK_Publishing_Admin_Starter_Guide_PNGs.zip.b64)
                  cp -f "$nested" "assets/ftpe/bonus_sets/$name"
                  ;;
                *)
                  cp -f "$nested" "assets/ftpe/social_sets/$name"
                  ;;
              esac
            done < <(find "$EXTRACT_DIR" -type f \( -iname '*.zip' -o -iname '*.zip.b64' \))
          elif [ "$DIRECT_PNG_COUNT" -ge 5 ]; then
            echo "Direct PNG ZIP detected; storing it as the runner social master archive."
            cp -f "$ASSET_ZIP" assets/ftpe/social_master/FTPE_social_master_assets.zip
          else
            echo "The Drive ZIP must contain either at least five PNG files or nested social-set ZIP files."
            echo "Direct PNG count: ${DIRECT_PNG_COUNT}; nested ZIP count: ${NESTED_ZIP_COUNT}."
            echo "Top-level archive listing:"
            unzip -Z1 "$ASSET_ZIP" | sed -n '1,160p'
            exit 1
          fi

          echo "Imported FTPE asset files for this workflow run:"
          find assets/ftpe/social_master assets/ftpe/social_sets assets/ftpe/bonus_sets -type f \( -iname '*.png' -o -iname '*.zip' -o -iname '*.zip.b64' \) | sort | sed -n '1,200p'

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build one Pinterest pin, one Facebook carousel, and one Pinterest video
        run: node scripts/build-ftpe-pin-and-fb-carousel.mjs

      - name: Upload generated FTPE video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftpe-social-video-${{ env.DATE_OVERRIDE }}
          path: |
            social/ftpe/${{ env.DATE_OVERRIDE }}/pinterest_video/pinterest_video.mp4
            social/ftpe/${{ env.DATE_OVERRIDE }}/manifest.json
          if-no-files-found: warn

      - name: Commit generated FTPE video and social assets before posting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/ftpe
          if git diff --cached --quiet; then
            echo "No pre-post FTPE social assets to commit."
          else
            git commit -m "Save FTPE social video and assets for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
              git pull --rebase origin main
            done
            git push
          fi

      - name: Post or prepare Pinterest pin and Facebook carousel
        continue-on-error: true
        run: node scripts/post-ftpe-pin-and-fb-carousel.mjs
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

      - name: Post or prepare Pinterest video
        continue-on-error: true
        run: node scripts/post-ftpe-pinterest-video.mjs
        env:
          FTPE_PINTEREST_VIDEO_POST_MODE: ${{ env.FTPE_SOCIAL_POST_MODE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Post or prepare YouTube Short
        continue-on-error: true
        run: node scripts/post-ftpe-youtube-short.mjs
        env:
          YOUTUBE_POST_MODE: ${{ env.FTPE_SOCIAL_POST_MODE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}

      - name: Commit generated FTPE social records
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/ftpe
          if git diff --cached --quiet; then
            echo "No FTPE social output changes to commit."
          else
            git commit -m "Build FTPE pin, carousel and video for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
              git pull --rebase origin main
            done
            git push
          fi
