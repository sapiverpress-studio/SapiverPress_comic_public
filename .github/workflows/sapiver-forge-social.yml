name: Sapiver Forge Facebook, Pinterest and YouTube Distribution

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      day_number:
        description: "Optional day override 1-7"
        required: false
        default: ""
        type: string
      post_mode:
        description: "Build only or publish live"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - live

permissions:
  contents: write

concurrency:
  group: sapiver-forge-social-daily
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select day and mode
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ inputs.day_number }}"
          if [ -z "$DAY" ]; then DAY="$(TZ=Europe/London date +%u)"; fi
          echo "$DAY" | grep -Eq '^[1-7]$'
          MODE="${{ inputs.post_mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="live"; fi
          echo "DAY_NUMBER=$DAY" >> "$GITHUB_ENV"
          echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          echo "SAPIVER_FORGE_POST_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Pull latest human-approved weekly bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/sapiver-forge
          git clone --depth 1 https://github.com/sapiverpress-studio/SapiverForge.git vendor/sapiver-forge
          BRIDGE="vendor/sapiver-forge/bridge/sapiver-forge-weekly/latest"
          if [ ! -f "$BRIDGE/approved-manifest.json" ]; then
            echo "No approved Sapiver Forge weekly bridge is available. Nothing will be posted."
            echo "BRIDGE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          (cd "$BRIDGE" && sha256sum -c file-hashes.sha256)
          test "$(cat "$BRIDGE/candidate-id.txt" | tr -d '\n')" = "$(node -p "require('./$BRIDGE/approved-manifest.json').candidate_id")"
          echo "BRIDGE_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "BRIDGE_ROOT=$BRIDGE" >> "$GITHUB_ENV"

      - name: Build today's approved social package
        if: env.BRIDGE_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.BRIDGE_ROOT,date=process.env.DATE_OVERRIDE,day=Number(process.env.DAY_NUMBER);
          const bridge=JSON.parse(fs.readFileSync(path.join(root,'approved-manifest.json'),'utf8'));
          if(bridge.approved!==true) throw new Error('Weekly bridge is not approved.');
          const item=bridge.posts.find(p=>p.index===day);
          if(!item) throw new Error(`Approved bridge has no day ${day}.`);
          if(!item.video||!item.youtube_title||!item.youtube_description) throw new Error('Approved bridge does not yet contain YouTube video metadata. Re-run the Sapiver Forge approval workflow after the bridge update.');
          if(!item.social_comment||/https?:\/\//i.test(item.social_comment)) throw new Error('Approved social comment must use link-in-bio wording and contain no direct URL.');
          const out=path.join('social','sapiver-forge',date);
          fs.mkdirSync(out,{recursive:true});
          const write=(name,text)=>{const p=path.join(out,name);fs.writeFileSync(p,String(text).trim()+'\n');return p;};
          const image=path.join(out,'approved-social.png');
          const video=path.join(out,'approved-short.mp4');
          fs.copyFileSync(path.join(root,item.image),image);
          fs.copyFileSync(path.join(root,item.video),video);
          if(!fs.statSync(video).size) throw new Error('Approved YouTube video is empty.');
          const manifest={
            type:'sapiver_forge_weekly_promo',
            candidate_id:bridge.candidate_id,
            week:bridge.week,
            day_number:day,
            article_url:item.product_url,
            approved:{facebook:true,pinterest:true,youtube:true},
            facebook:{post_caption:write('facebook-post.txt',item.facebook_post),first_comment:write('facebook-first-comment.txt',item.social_comment),images:[image]},
            pinterest:{title:write('pinterest-title.txt',item.pinterest_title),caption:write('pinterest-caption.txt',item.pinterest_description),image},
            youtube:{video,title:write('youtube-title.txt',item.youtube_title),caption:write('youtube-description.txt',item.youtube_description)}
          };
          fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          console.log(`Prepared approved day ${day}: ${item.day}`);
          NODE

      - name: Post approved Facebook, Pinterest and YouTube content
        if: env.BRIDGE_AVAILABLE == 'true'
        run: node scripts/post-sapiver-forge-social.mjs
        env:
          DATE_OVERRIDE: ${{ env.DATE_OVERRIDE }}
          SAPIVER_FORGE_POST_MODE: ${{ env.SAPIVER_FORGE_POST_MODE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_API_TOKEN: ${{ secrets.PINTEREST_API_TOKEN }}
          PINTEREST_OAUTH_TOKEN: ${{ secrets.PINTEREST_OAUTH_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ${{ secrets.PINTEREST_BOARD_NAME }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          FORCE_SAPIVER_FORGE_POST: ${{ secrets.FORCE_SAPIVER_FORGE_POST || secrets.FORCE_CLEARFORGE_POST }}

      - name: Show posting result
        if: env.BRIDGE_AVAILABLE == 'true' && always()
        shell: bash
        run: |
          RESULT="social/sapiver-forge/${DATE_OVERRIDE}/post-result.json"
          if [ -f "$RESULT" ]; then cat "$RESULT"; else echo "No posting result was produced."; fi

      - name: Commit daily assets and posting record
        if: env.BRIDGE_AVAILABLE == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "social/sapiver-forge/${DATE_OVERRIDE}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Post approved Sapiver Forge social content for ${DATE_OVERRIDE}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
