name: Publishing Fact Daily Post (Manual Only)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual-only archive workflow. Daily facts now feed the combined FTPE daily post."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain parked workflow
        run: |
          echo "This standalone Publishing Fact workflow is parked."
          echo "Daily publishing facts now feed the main FTPE daily social workflow/caption."
          echo "One daily post rule: carousel + about snippet + fact and/or anecdote."
