name: Remove 110 audited individual Sapiver Forge and Clearforge Pins
on:
  pull_request:
    paths:
      - 'scripts/cleanup-sapiver-forge-pins.mjs'
      - 'test/cleanup-sapiver-forge-pins.test.mjs'
      - '.github/workflows/forge-pin-selective-cleanup.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-pin-selective-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

# All Pinterest refreshes must serialize against product Pins and video publishing.
concurrency:
  group: sapiver-pinterest-token-rotation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/cleanup-sapiver-forge-pins.mjs
            scripts/post-sapiver-prints.mjs
            test/cleanup-sapiver-forge-pins.test.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fail-closed individual Pin selection (no provider calls)
        run: |
          node --check scripts/cleanup-sapiver-forge-pins.mjs
          node --test test/cleanup-sapiver-forge-pins.test.mjs
  audit:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            scripts/cleanup-sapiver-forge-pins.mjs
            scripts/post-sapiver-prints.mjs
            test/cleanup-sapiver-forge-pins.test.mjs
            social/sapiver-prints/pinterest-receipts.json
            social/sapiver-forge/pin-cleanup-audit.json
            social/sapiver-forge/pin-cleanup-result.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete only 110 hash-locked Forge Pins, never boards or Sapiver Prints
        id: pinterest
        env:
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_OUT: ${{ runner.temp }}/forge-pin-cleanup-rotation.txt
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          PINTEREST_CLEANUP_MODE: delete
          PINTEREST_CLEANUP_AUDIT_HASH: '6e807d28be47126b07b2c71ffd8af15122b4a9ee150285e26ee945e533bfbae3'
        run: node scripts/cleanup-sapiver-forge-pins.mjs
      - name: Save rotated Pinterest credential securely
        if: always()
        id: rotate
        shell: bash
        env:
          ROTATED_FILE: ${{ runner.temp }}/forge-pin-cleanup-rotation.txt
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s "$ROTATED_FILE" ]; then exit 0; fi
          test -n "$GH_TOKEN"
          token="$(tr -d '\r\n' < "$ROTATED_FILE")"
          [[ "$token" == pinr* ]] || { echo 'Unexpected Pinterest refresh token'; exit 1; }
          printf '%s' "$token" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          unset token
          rm -f "$ROTATED_FILE"
          echo 'Pinterest refresh token rotated without exposing it.'
      - name: Commit safe audit IDs for verification
        if: always()
        id: save
        shell: bash
        run: |
          set -euo pipefail
          for report in social/sapiver-forge/pin-cleanup-audit.json social/sapiver-forge/pin-cleanup-result.json; do
            if [ -f "$report" ]; then git add -f "$report"; fi
          done
          if git diff --cached --quiet; then
            echo 'No updated cleanup audit/receipts.'
            exit 0
          fi
          git config user.name "sapiver-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(pinterest): snapshot Forge cleanup candidate IDs [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Fail visibly if read-only audit or credential persistence failed
        if: always() && (steps.pinterest.outcome != 'success' || steps.rotate.outcome != 'success' || steps.save.outcome != 'success')
        run: exit 1
