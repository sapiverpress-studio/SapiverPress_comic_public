name: Publish Approved Daily Brief Socials

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SEND to publish the newest fully released SapiverForge edition
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sapiver-daily-brief-social-bridge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Validate human confirmation
        run: |
          set -euo pipefail
          [ "$CONFIRM" = SEND ] || { echo 'Confirmation must be exactly SEND.' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Instagram publisher syntax
        run: node --check scripts/post-daily-brief-instagram.mjs
      - name: Resolve Meta Page token
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN || secrets.META_SYSTEM_USER_TOKEN_TEST }}
          FB_PAGE_TOKEN_FALLBACK: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const apiVersion = process.env.META_GRAPH_API_VERSION || 'v24.0';
          const systemToken = String(process.env.META_SYSTEM_USER_TOKEN || '').trim();
          const fallbackToken = String(process.env.FB_PAGE_TOKEN_FALLBACK || '').trim();
          const pageId = String(process.env.FB_PAGE_ID || '').trim();
          const igId = String(process.env.INSTAGRAM_BUSINESS_ACCOUNT_ID || '').trim();
          if (!pageId) throw new Error('FB_PAGE_ID is required.');

          async function get(url, token) {
            const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const text = await r.text();
            let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
            if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(data).slice(0, 800)}`);
            return data;
          }

          let pageToken = fallbackToken;
          let source = 'legacy-page-token';

          if (systemToken) {
            const page = await get(`https://graph.facebook.com/${apiVersion}/${encodeURIComponent(pageId)}?fields=id,name,access_token,instagram_business_account`, systemToken);
            if (String(page.id) !== pageId) throw new Error(`Page ID mismatch: got ${page.id}`);
            if (!page.access_token) throw new Error('System-user token could not derive a Page access token.');
            if (igId && String(page.instagram_business_account?.id || '') !== igId) {
              throw new Error(`Linked Instagram account mismatch: got ${page.instagram_business_account?.id || 'none'}`);
            }
            pageToken = String(page.access_token);
            source = 'meta-system-user';
          }

          if (!pageToken) throw new Error('No usable Meta Page token is available.');
          const me = await get(`https://graph.facebook.com/${apiVersion}/me?fields=id,name`, pageToken);
          if (String(me.id) !== pageId) throw new Error(`Resolved token identity ${me.id} does not match Page ${pageId}.`);

          console.log(`::add-mask::${pageToken}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FB_PAGE_TOKEN=${pageToken}\nFACEBOOK_PAGE_ACCESS_TOKEN=${pageToken}\n`);
          console.log(`Meta Page token source: ${source}`);
          NODE
      - name: Read current SapiverForge release history
        uses: actions/checkout@v4
        with:
          repository: sapiverpress-studio/SapiverForge
          ref: main
          path: vendor/sapiver-forge
          token: ${{ secrets.COMIC_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - name: Resolve newest fully released edition
        id: release
        working-directory: vendor/sapiver-forge
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const base = 'news-intelligence';
          const dates = fs.readdirSync(base, { withFileTypes: true })
            .filter(entry => entry.isDirectory() && /^\\d{4}-\\d{2}-\\d{2}$/.test(entry.name))
            .map(entry => entry.name)
            .sort()
            .reverse();

          let selected;
          for (const date of dates) {
            const root = path.join(base, date);
            const required = ['manifest.json', 'site-release.json', 'netlify-release.json'];
            if (!required.every(name => fs.existsSync(path.join(root, name)))) continue;
            const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
            const site = JSON.parse(fs.readFileSync(path.join(root, 'site-release.json'), 'utf8'));
            const netlify = JSON.parse(fs.readFileSync(path.join(root, 'netlify-release.json'), 'utf8'));
            const candidate = String(manifest.candidate_id || '');
            if (!/^[a-f0-9]{64}$/.test(candidate)) continue;
            if (manifest.date !== date || manifest.newsletter_ready_for_human_approval !== true) continue;
            if (site.date !== date || site.candidate_id !== candidate) continue;
            if (netlify.date !== date || netlify.candidate_id !== candidate || netlify.status !== 'deployed') continue;

            const daily = path.join('reports/daily-intelligence', date);
            const contractPath = path.join(daily, 'candidate-manifest.json');
            if (!fs.existsSync(contractPath)) continue;
            const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
            if (contract.date !== date || contract.type !== 'sapiver_forge_daily_detailed_story') continue;
            let hashesValid = true;
            for (const [name, expected] of Object.entries(contract.file_hashes || {})) {
              const file = path.join(daily, name);
              if (path.basename(name) !== name || !fs.existsSync(file)) { hashesValid = false; break; }
              const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              if (actual !== expected) { hashesValid = false; break; }
            }
            if (!hashesValid) continue;

            const episode = JSON.parse(fs.readFileSync(path.join(daily, 'episode-metadata.json'), 'utf8'));
            const short = path.join('public/podcast/episodes', `${episode.slug}-short.mp4`);
            if (!/^[a-z0-9][a-z0-9-]*$/i.test(episode.slug || '') || !fs.existsSync(short) || fs.statSync(short).size < 1000) continue;
            selected = { date, candidate };
            break;
          }

          if (!selected) throw new Error('No fully released SapiverForge edition with matching website, Netlify, media and candidate receipts was found.');
          const sourceSha = require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          fs.appendFileSync(process.env.GITHUB_ENV, `EDITION_DATE=${selected.date}\\nCANDIDATE_ID=${selected.candidate}\\nSOURCE_SHA=${sourceSha}\\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `edition_date=${selected.date}\\ncandidate_id=${selected.candidate}\\nsource_sha=${sourceSha}\\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Newest fully released edition: ${selected.date} (${selected.candidate.slice(0, 12)}…)\\n`);
          console.log(`Selected released edition ${selected.date} from SapiverForge ${sourceSha.slice(0, 12)}…`);
          NODE
      - name: Publish with this repository's credentials
        id: socials
        continue-on-error: true
        working-directory: vendor/sapiver-forge
        env:
          EDITION_DATE: ${{ env.EDITION_DATE }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          CANDIDATE_ID: ${{ env.CANDIDATE_ID }}
          CONFIRM: ${{ env.CONFIRM }}
          BRIDGE_RECEIPT_DIR: ${{ github.workspace }}/social/daily-brief/${{ env.EDITION_DATE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_OUT: ${{ runner.temp }}/pinterest-refresh-token.txt
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ${{ secrets.PINTEREST_BOARD_NAME }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/run-daily-social-bridge.mjs
      - name: Persist rotated Pinterest refresh token
        id: pinterest_rotation
        if: always() && steps.socials.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          ROTATED_TOKEN_FILE: ${{ runner.temp }}/pinterest-refresh-token.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ROTATED_TOKEN_FILE" ]; then
            echo 'No Pinterest refresh-token rotation occurred in this run.'
            exit 0
          fi
          test -n "${GH_TOKEN:-}" || { echo 'COMIC_GITHUB_TOKEN is unavailable for Pinterest token rotation.' >&2; exit 1; }
          token="$(tr -d '\r\n' < "$ROTATED_TOKEN_FILE")"
          [[ "$token" == pinr* ]] || { echo 'Pinterest returned an unexpected refresh-token format.' >&2; exit 1; }
          printf '%s' "$token" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          unset token
          rm -f "$ROTATED_TOKEN_FILE"
          echo 'Pinterest continuous refresh token rotated in GitHub Actions secrets.'
      - name: Publish Instagram Reel
        id: instagram
        if: always() && steps.socials.outcome != 'skipped'
        continue-on-error: true
        env:
          SOURCE_ROOT: ${{ github.workspace }}/vendor/sapiver-forge
          BRIDGE_RECEIPT_DIR: ${{ github.workspace }}/social/daily-brief/${{ env.EDITION_DATE }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: node scripts/post-daily-brief-instagram.mjs
      - name: Persist individual posting receipts
        if: always() && (steps.socials.outcome != 'skipped' || steps.instagram.outcome != 'skipped')
        run: |
          set -euo pipefail
          RECEIPTS="social/daily-brief/$EDITION_DATE"
          test -d "$RECEIPTS" || exit 0
          git config user.name 'sapiver-social-bridge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RECEIPTS"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Daily Brief social results $EDITION_DATE [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Retain recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-social-receipts-${{ env.EDITION_DATE }}-${{ github.run_id }}
          path: social/daily-brief/${{ env.EDITION_DATE }}/
          if-no-files-found: warn
      - name: Fail visibly when a channel did not publish or Pinterest rotation failed
        if: always() && (steps.socials.outcome != 'success' || steps.instagram.outcome != 'success' || steps.pinterest_rotation.outcome == 'failure')
        run: |
          echo '::error::Social release incomplete. Read channel receipts and Pinterest token-rotation status before retrying.'
          exit 1
