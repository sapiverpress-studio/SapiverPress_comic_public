name: Auto-post Sapiver Prints Etsy products to Pinterest

on:
  schedule:
    # Hourly fallback when the near-immediate SapiverForge catalogue handoff is unavailable.
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      feed_sha:
        description: Optional exact 40-character SapiverForge feed commit SHA
        required: false
        type: string
  repository_dispatch:
    types: [sapiver_prints_new_listing]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sapiverprints-pinterest.yml'

permissions:
  contents: write

# Shared lock with the other two existing Pinterest workflows.
concurrency:
  group: sapiver-pinterest-token-rotation
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            scripts/post-sapiver-prints.mjs
            test/sapiverprints-pinterest.test.mjs
            social/sapiver-prints/pinterest-receipts.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test public-feed and Pinterest duplicate-safety contracts
        run: |
          node --check scripts/post-sapiver-prints.mjs
          node --test test/sapiverprints-pinterest.test.mjs

      - name: Publish ALL pending Etsy listing Pins in paced batches (max 20 per run)
        id: publish
        env:
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN_OUT: ${{ runner.temp }}/sapiverprints-pinterest-refresh.txt
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          SAPIVER_PRINTS_MAX_PINS: '20'
          # The new-listing handoff pins an immutable, freshly committed Etsy snapshot.
          SAPIVER_ETSY_FEED_SHA: ${{ inputs.feed_sha || github.event.client_payload.feed_sha }}
        run: node scripts/post-sapiver-prints.mjs

      - name: Persist Pinterest rotating credential without exposing it
        if: always()
        id: rotate
        env:
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          ROTATED_FILE: ${{ runner.temp }}/sapiverprints-pinterest-refresh.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ROTATED_FILE" ]; then
            echo 'No Pinterest refresh token rotation was performed.'
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo 'GitHub token needed to persist Pinterest rotation'; exit 1; }
          token="$(tr -d '\r\n' < "$ROTATED_FILE")"
          [[ "$token" == pinr* ]] || { echo 'Invalid rotated Pinterest token format'; exit 1; }
          printf '%s' "$token" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          unset token
          rm -f "$ROTATED_FILE"
          echo 'Pinterest continuous refresh credential safely rotated.'

      - name: Preserve Pin receipts even on partial failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f social/sapiver-prints/pinterest-receipts.json ]; then
            echo 'No new Pin receipt to persist.'
            exit 0
          fi
          git add social/sapiver-prints/pinterest-receipts.json
          if git diff --cached --quiet; then
            echo 'All Pinterest listing receipts already saved.'
            exit 0
          fi
          git config user.name "sapiverprints-pinterest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pinterest): record Sapiver Prints posted Etsy listing IDs [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Receipt persistence failed. Next run will inspect actual board Pins before retrying.'
          exit 1

      - name: Fail visibly on publishing or rotation problems
        if: always() && (steps.publish.outcome != 'success' || steps.rotate.outcome != 'success')
        run: |
          echo '::error::Sapiver Prints Pinterest posting needs checking.'
          exit 1

# Automated from SapiverForge after a changed, successfully committed live Etsy feed; hourly fallback.
# 20 Pins per run with 30-second spacing (implemented in publisher), receipt/board dedup.
