name: Test Meta System User Token Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-meta-system-user-token-once.yml'

permissions:
  contents: read

jobs:
  test-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify system-user token, Page access and Instagram access
        env:
          META_SYSTEM_USER_TOKEN_TEST: ${{ secrets.META_SYSTEM_USER_TOKEN_TEST }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          const token = process.env.META_SYSTEM_USER_TOKEN_TEST || '';
          const pageId = process.env.FB_PAGE_ID || '';
          const igId = process.env.INSTAGRAM_BUSINESS_ACCOUNT_ID || '';
          if (!token || !pageId || !igId) throw new Error('Missing META_SYSTEM_USER_TOKEN_TEST, FB_PAGE_ID or INSTAGRAM_BUSINESS_ACCOUNT_ID.');

          async function get(url, accessToken) {
            const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
            const text = await r.text();
            let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
            if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(data).slice(0,800)}`);
            return data;
          }

          const me = await get('https://graph.facebook.com/v24.0/me?fields=id,name', token);
          console.log(`SYSTEM_TOKEN_AUTHENTICATED=${Boolean(me.id)}`);
          console.log(`SYSTEM_TOKEN_IDENTITY=${me.name || 'system-user'}`);

          const perms = await get('https://graph.facebook.com/v24.0/me/permissions', token);
          const wanted = ['pages_show_list','pages_read_engagement','pages_manage_posts','instagram_basic','instagram_content_publish'];
          const permissionMap = Object.fromEntries((perms.data || []).map(p => [p.permission, p.status]));
          for (const p of wanted) console.log(`${p}=${permissionMap[p] || 'not_returned'}`);
          const missing = wanted.filter(p => permissionMap[p] !== 'granted');
          if (missing.length) throw new Error(`Required permissions not granted: ${missing.join(', ')}`);

          const page = await get(`https://graph.facebook.com/v24.0/${encodeURIComponent(pageId)}?fields=id,name,access_token,instagram_business_account`, token);
          if (String(page.id) !== String(pageId)) throw new Error(`Page ID mismatch: got ${page.id}`);
          if (!page.access_token) throw new Error('System-user token could not derive a Page access token.');
          if (String(page.instagram_business_account?.id || '') !== String(igId)) throw new Error(`Linked Instagram account mismatch: got ${page.instagram_business_account?.id || 'none'}`);
          console.log('PAGE_LOOKUP=ok');
          console.log('DERIVED_PAGE_TOKEN=present');
          console.log('LINKED_INSTAGRAM_ACCOUNT=matches');

          const pageMe = await get('https://graph.facebook.com/v24.0/me?fields=id,name', page.access_token);
          if (String(pageMe.id) !== String(pageId)) throw new Error(`Derived token identity ${pageMe.id} does not match Page ${pageId}.`);
          console.log('DERIVED_PAGE_TOKEN_IDENTITY=page');

          const ig = await get(`https://graph.facebook.com/v24.0/${encodeURIComponent(igId)}?fields=id,username`, page.access_token);
          if (String(ig.id) !== String(igId)) throw new Error(`Instagram ID mismatch: got ${ig.id}`);
          console.log(`INSTAGRAM_READ_ACCESS=ok`);
          console.log(`INSTAGRAM_USERNAME=${ig.username || 'available'}`);
          console.log('NO_CONTENT_WAS_PUBLISHED=true');
          NODE
