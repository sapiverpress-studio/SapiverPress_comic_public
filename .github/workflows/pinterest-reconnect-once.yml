name: Reconnect Pinterest OAuth Once

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: Full Pinterest callback URL from the browser address bar after authorising
        required: true
        type: string
      confirm:
        description: Type CONNECT to replace the Pinterest access and refresh secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange Pinterest authorisation code securely
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CONFIRM: ${{ inputs.confirm }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          ACCESS_FILE: ${{ runner.temp }}/pinterest-access-token.txt
          REFRESH_FILE: ${{ runner.temp }}/pinterest-refresh-token.txt
        shell: bash
        run: |
          set -euo pipefail
          [ "$CONFIRM" = CONNECT ] || { echo 'Confirmation must be exactly CONNECT.' >&2; exit 1; }
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const callbackText = String(process.env.CALLBACK_URL || '').trim();
          const clientId = String(process.env.PINTEREST_CLIENT_ID || process.env.PINTEREST_APP_ID || '').trim();
          const clientSecret = String(process.env.PINTEREST_CLIENT_SECRET || process.env.PINTEREST_APP_SECRET || '').trim();
          const redirectUri = 'https://sapiverpress-studio.github.io';
          const expectedState = 'sapiver-forge-pinterest-reconnect-20260916';
          if (!callbackText || !clientId || !clientSecret) throw new Error('Pinterest callback or app credentials are unavailable.');

          const callback = new URL(callbackText);
          if (callback.origin !== 'https://sapiverpress-studio.github.io' || callback.pathname !== '/') {
            throw new Error('Callback URL does not match the registered GitHub Pages redirect.');
          }
          if (callback.searchParams.get('state') !== expectedState) throw new Error('Pinterest OAuth state does not match this reconnect request.');
          const oauthError = callback.searchParams.get('error');
          if (oauthError) throw new Error(`Pinterest authorisation failed: ${callback.searchParams.get('error_description') || oauthError}`);
          const code = String(callback.searchParams.get('code') || '').trim();
          if (!code) throw new Error('Pinterest callback URL contains no authorisation code.');

          const basic = Buffer.from(`${clientId}:${clientSecret}`).toString('base64');
          const response = await fetch('https://api.pinterest.com/v5/oauth/token', {
            method: 'POST',
            headers: { Authorization: `Basic ${basic}`, 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'authorization_code',
              code,
              redirect_uri: redirectUri,
              continuous_refresh: 'true'
            })
          });
          const text = await response.text();
          let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
          if (!response.ok) throw new Error(`Pinterest token exchange failed (${response.status}): ${JSON.stringify(data).slice(0, 800)}`);
          if (!data.access_token || !data.refresh_token) throw new Error('Pinterest did not return both access and continuous refresh tokens.');

          const scopes = new Set(String(data.scope || '').split(/[\s,]+/).filter(Boolean));
          const required = ['boards:read', 'boards:write', 'pins:read', 'pins:write'];
          const missing = required.filter((scope) => !scopes.has(scope));
          if (missing.length) throw new Error(`Pinterest token is missing required scopes: ${missing.join(', ')}`);

          const boardsResponse = await fetch('https://api.pinterest.com/v5/boards?page_size=1', {
            headers: { Authorization: `Bearer ${data.access_token}` }
          });
          if (!boardsResponse.ok) throw new Error(`Pinterest access-token verification failed (${boardsResponse.status}).`);

          console.log(`::add-mask::${data.access_token}`);
          console.log(`::add-mask::${data.refresh_token}`);
          fs.writeFileSync(process.env.ACCESS_FILE, `${data.access_token}\n`, { mode: 0o600 });
          fs.writeFileSync(process.env.REFRESH_FILE, `${data.refresh_token}\n`, { mode: 0o600 });
          console.log(`PINTEREST_OAUTH=verified`);
          console.log(`PINTEREST_REQUIRED_SCOPES=granted`);
          console.log(`ACCESS_TOKEN_LIFETIME_SECONDS=${data.expires_in || 'not_returned'}`);
          console.log(`REFRESH_TOKEN_LIFETIME_SECONDS=${data.refresh_token_expires_in || 'not_returned'}`);
          console.log('NO_PIN_WAS_PUBLISHED=true');
          NODE
      - name: Store Pinterest tokens in GitHub Actions secrets
        env:
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          ACCESS_FILE: ${{ runner.temp }}/pinterest-access-token.txt
          REFRESH_FILE: ${{ runner.temp }}/pinterest-refresh-token.txt
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'COMIC_GITHUB_TOKEN is unavailable.' >&2; exit 1; }
          test -s "$ACCESS_FILE" && test -s "$REFRESH_FILE"
          printf '%s' "$(tr -d '\r\n' < "$ACCESS_FILE")" | gh secret set PINTEREST_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          printf '%s' "$(tr -d '\r\n' < "$REFRESH_FILE")" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          rm -f "$ACCESS_FILE" "$REFRESH_FILE"
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^PINTEREST_ACCESS_TOKEN'
          gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^PINTEREST_REFRESH_TOKEN'
          echo 'PINTEREST_GITHUB_SECRETS=updated'
