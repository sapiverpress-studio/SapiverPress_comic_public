name: Test Facebook Page Publish Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-facebook-page-once.yml'

permissions:
  contents: write

jobs:
  test-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDITION_DATE: '2026-09-15'
      SOURCE_SHA: '3353dbe888435352f283fb597245eac4f79a53ed'
      CANDIDATE_ID: '2539680f931c71a6c38950cbfd1174205e45141c4688e9efd035e047eeccadea'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read exact released source commit
        uses: actions/checkout@v4
        with:
          repository: sapiverpress-studio/SapiverForge
          ref: 3353dbe888435352f283fb597245eac4f79a53ed
          path: vendor/sapiver-forge
          persist-credentials: false
      - name: Verify Page token and publish Facebook post
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const token = process.env.FB_PAGE_TOKEN || '';
          const pageId = process.env.FB_PAGE_ID || '';
          if (!token || !pageId) throw new Error('Missing FB_PAGE_TOKEN or FB_PAGE_ID.');
          async function api(url, options={}) {
            const r = await fetch(url, options);
            const text = await r.text();
            let data; try { data = text ? JSON.parse(text) : {}; } catch { data = {raw:text}; }
            if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(data).slice(0,1000)}`);
            return data;
          }
          const me = await api('https://graph.facebook.com/v24.0/me?fields=id,name', {headers:{Authorization:`Bearer ${token}`}});
          if (String(me.id) !== String(pageId)) throw new Error(`FB_PAGE_TOKEN is still not a Page token. Token identity ${me.id} does not match Page ${pageId}.`);

          const manifestPath = `vendor/sapiver-forge/news-intelligence/${process.env.EDITION_DATE}/manifest.json`;
          const releasePath = `vendor/sapiver-forge/news-intelligence/${process.env.EDITION_DATE}/site-release.json`;
          const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const release = JSON.parse(fs.readFileSync(releasePath,'utf8'));
          if (manifest.candidate_id !== process.env.CANDIDATE_ID || release.candidate_id !== process.env.CANDIDATE_ID) throw new Error('Released candidate mismatch.');

          const receiptDir = path.join('social','daily-brief',process.env.EDITION_DATE);
          fs.mkdirSync(receiptDir,{recursive:true});
          const receiptPath = path.join(receiptDir,'social-distribution.json');
          const receipt = fs.existsSync(receiptPath) ? JSON.parse(fs.readFileSync(receiptPath,'utf8')) : {date:process.env.EDITION_DATE};
          if (receipt.facebook?.id) {
            console.log(`Facebook already published: ${receipt.facebook.id}`);
            process.exit(0);
          }
          const message = String(manifest.social?.facebook_post || manifest.social?.lead_headline || 'Sapiver Forge Daily Brief').trim();
          const link = `https://suite.sapiverpress.co.uk/daily-brief/intelligence/${process.env.EDITION_DATE}/`;
          const posted = await api(`https://graph.facebook.com/v24.0/${encodeURIComponent(pageId)}/feed`, {
            method:'POST',
            body:new URLSearchParams({message,link,access_token:token})
          });
          receipt.facebook = {id:posted.id,published_at:new Date().toISOString()};
          delete receipt.facebook_error;
          receipt.updated_at = new Date().toISOString();
          fs.writeFileSync(receiptPath,JSON.stringify(receipt,null,2)+'\n');
          console.log(`Facebook published: ${posted.id}`);
          NODE
      - name: Persist Facebook receipt
        run: |
          set -euo pipefail
          git config user.name 'sapiver-social-bridge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add social/daily-brief/2026-09-15/social-distribution.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Facebook publish test 2026-09-15 [skip ci]'
            git push origin HEAD:main
          fi
