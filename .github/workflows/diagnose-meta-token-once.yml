name: Diagnose Meta Token Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-meta-token-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Facebook token identity and permissions
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          node - <<'NODE'
          const token = process.env.FB_PAGE_TOKEN || '';
          const expected = process.env.FB_PAGE_ID || '';
          if (!token || !expected) throw new Error('Missing Facebook secret(s).');
          async function get(url) {
            const r = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const text = await r.text();
            let data; try { data = JSON.parse(text); } catch { data = { raw: text }; }
            if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(data)}`);
            return data;
          }
          const me = await get('https://graph.facebook.com/v24.0/me?fields=id,name');
          console.log(`TOKEN_IDENTITY_MATCHES_PAGE=${String(me.id) === String(expected)}`);
          console.log(`TOKEN_IDENTITY_TYPE=${String(me.id) === String(expected) ? 'PAGE' : 'NOT_PAGE'}`);
          try {
            const perms = await get('https://graph.facebook.com/v24.0/me/permissions');
            const wanted = ['pages_show_list','pages_read_engagement','pages_manage_posts','instagram_basic','instagram_content_publish'];
            const map = Object.fromEntries((perms.data || []).map(x => [x.permission, x.status]));
            for (const p of wanted) console.log(`${p}=${map[p] || 'not_returned'}`);
          } catch (e) {
            console.log(`PERMISSIONS_QUERY=${e.message.slice(0,300)}`);
          }
          NODE
