name: Sapiver Prints video publishing

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Scoped video ID from existing protected uploader"
        type: string
        required: true
      ticket:
        description: "Short-lived encrypted media ticket; never log"
        type: string
        required: true

permissions:
  contents: read

# Same lock as existing Sapiver Prints Pinterest image scheduler.
concurrency:
  group: sapiver-pinterest-token-rotation
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sapiverpress-studio/SapiverPress_comic_public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish video and report both platform IDs to private uploader
        env:
          SAPIVER_VIDEO_ID: ${{ inputs.video_id }}
          SAPIVER_VIDEO_TICKET: ${{ inputs.ticket }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN_OUT: ${{ runner.temp }}/sapiverprints-video-refresh.txt
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
        run: |
          node --check scripts/post-sapiverprints-video.mjs
          node scripts/post-sapiverprints-video.mjs
      - name: Persist rotating Pinterest token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.COMIC_GITHUB_TOKEN }}
          ROTATED_FILE: ${{ runner.temp }}/sapiverprints-video-refresh.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ROTATED_FILE" ]; then
            echo 'No Pinterest refresh rotation performed'
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo 'Required GitHub secret-rotation authority unavailable'; exit 1; }
          rotated="$(tr -d '\r\n' < "$ROTATED_FILE")"
          [[ "$rotated" == pinr* ]] || { echo 'Unexpected Pinterest token format'; exit 1; }
          printf '%s' "$rotated" | gh secret set PINTEREST_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          unset rotated
          rm -f "$ROTATED_FILE"
          echo 'Pinterest refresh token saved'
