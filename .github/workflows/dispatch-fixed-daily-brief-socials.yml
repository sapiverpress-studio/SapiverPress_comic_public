name: Retry Corrected Daily Brief Social Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-fixed-daily-brief-socials.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected SEND-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run daily-brief-social-bridge.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm=SEND
          echo 'Corrected Daily Brief social workflow dispatched.'
