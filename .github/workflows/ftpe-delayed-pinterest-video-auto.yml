name: FTPE Pinterest Video Auto Disabled

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  delayed-pinterest-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run options
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "DATE_OVERRIDE=${{ github.event.inputs.date_override }}" >> "$GITHUB_ENV"
          else
            echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          fi
          echo "FTPE_PINTEREST_VIDEO_POST_MODE=live" >> "$GITHUB_ENV"

      - name: Post Pinterest video rescue only
        run: node scripts/post-ftpe-pinterest-video.mjs
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Commit Pinterest video result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/ftpe
          if git diff --cached --quiet; then
            echo "No Pinterest video result changes to commit."
          else
            git commit -m "Post FTPE Pinterest video rescue for ${DATE_OVERRIDE}"
            git push
          fi
