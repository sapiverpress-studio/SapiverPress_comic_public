name: Book Content OS Social

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override YYYY-MM-DD"
        required: false
        default: ""
      post_mode:
        description: "live or dry_run"
        required: false
        default: "live"
  schedule:
    - cron: "15 17 * * *"

permissions:
  contents: write

jobs:
  book-content-os-social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "DATE_OVERRIDE=${{ github.event.inputs.date_override }}" >> "$GITHUB_ENV"
          else
            echo "DATE_OVERRIDE=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="live"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.post_mode || 'live' }}"
          else
            MODE="dry_run"
          fi

          echo "BOOK_CONTENT_OS_SOCIAL_POST_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "BOOK_CONTENT_OS_PINTEREST_VIDEO_POST_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "YOUTUBE_POST_MODE=${MODE}" >> "$GITHUB_ENV"

      - name: Ensure media tools are available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          fi
          ffmpeg -version | head -n 1
          unzip -v | head -n 1

      - name: Pull Book Content OS assets from shared Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/book-content-os/social_sets

          download_drive_zip() {
            local file_id="$1"
            local out_file="$2"
            local tmp_dir cookie_file first_response confirm_token
            tmp_dir="$(mktemp -d)"
            cookie_file="${tmp_dir}/cookies.txt"
            first_response="${tmp_dir}/drive-first-response"

            curl -L --fail --retry 3 -c "$cookie_file" \
              "https://drive.google.com/uc?export=download&id=${file_id}" \
              -o "$first_response"

            confirm_token="$(grep -oE 'confirm=([0-9A-Za-z_-]+)' "$first_response" | head -n 1 | cut -d= -f2 || true)"
            if [ -n "$confirm_token" ]; then
              curl -L --fail --retry 3 -b "$cookie_file" \
                "https://drive.google.com/uc?export=download&confirm=${confirm_token}&id=${file_id}" \
                -o "$out_file"
            else
              mv "$first_response" "$out_file"
            fi

            if ! unzip -t "$out_file" >/tmp/book-content-os-social-unzip-test.txt 2>&1; then
              echo "Downloaded file is not a valid ZIP: ${out_file}"
              echo "First 500 bytes follow:"
              head -c 500 "$out_file" || true
              echo ""
              cat /tmp/book-content-os-social-unzip-test.txt || true
              return 1
            fi
          }

          DRIVE_CONFIG="config/book-content-os-social-drive-zips.json"
          configured_count=0
          downloaded_count=0

          if [ ! -f "$DRIVE_CONFIG" ]; then
            if [ "${BOOK_CONTENT_OS_SOCIAL_POST_MODE}" = "live" ]; then
              echo "::error::Missing ${DRIVE_CONFIG}. Live Book Content OS posting requires a project-owned full-size Drive ZIP."
              exit 1
            fi
            echo "::warning::No ${DRIVE_CONFIG}; dry run may use repo fallback assets only."
          else
            echo "Checking Book Content OS ZIPs listed in ${DRIVE_CONFIG}."

            while IFS=$'\t' read -r file_id file_name target_dir; do
              configured_count=$((configured_count + 1))
              mkdir -p "$target_dir"
              out_file="${target_dir}/${file_name}"
              echo "Downloading ${file_name} from Drive file ${file_id} -> ${out_file}"
              if download_drive_zip "$file_id" "$out_file"; then
                downloaded_count=$((downloaded_count + 1))
              else
                echo "::error::Failed to download a configured Book Content OS social ZIP: ${file_name} (${file_id})"
              fi
            done < <(node --input-type=module - <<'NODE'
          import fs from "fs";
          const cfg = JSON.parse(fs.readFileSync("config/book-content-os-social-drive-zips.json", "utf8"));
          for (const item of cfg.files || []) {
            const id = String(item.drive_file_id || "").trim();
            if (!id) continue;
            const target = item.target_dir || cfg.target_dir_default || "assets/book-content-os/social_sets";
            console.log([id, item.file_name, target].join("\t"));
          }
          NODE
            )

            echo "Configured Book Content OS Drive ZIPs with IDs: ${configured_count}; downloaded valid ZIPs: ${downloaded_count}."

            if [ "$configured_count" -eq 0 ]; then
              if [ "${BOOK_CONTENT_OS_SOCIAL_POST_MODE}" = "live" ]; then
                echo "::error::No project-owned Drive ZIP is configured for Book Content OS live posting. Refusing to use repo fallback assets."
                exit 1
              fi
              echo "::warning::No project-owned Drive ZIP configured; dry run may use repo fallback assets only."
            fi

            if [ "$configured_count" -gt 0 ] && [ "$downloaded_count" -ne "$configured_count" ]; then
              echo "::error::Configured Drive source is incomplete. Failing rather than silently using partial assets."
              exit 1
            fi
          fi

          echo "BOOK_CONTENT_OS_DRIVE_ZIPS_DOWNLOADED=${downloaded_count}" >> "$GITHUB_ENV"
          if [ "$downloaded_count" -gt 0 ]; then
            echo "Drive ZIPs downloaded; disabling repo fallback .b64 image assets for this run."
            find assets/book-content-os/social_sets -type f \( -iname '*.png.b64' -o -iname '*.jpg.b64' -o -iname '*.jpeg.b64' -o -iname '*.zip.b64' \) -delete || true
            rm -rf assets/book-content-os/social_sets/_decoded_base64 || true
          fi

          echo "Book Content OS asset files available in this runner workspace:"
          find assets/book-content-os/social_sets -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.zip' -o -iname '*.zip.b64' -o -iname '*.b64' \) | sort | sed -n '1,240p' || true

      - name: Decode Book Content OS base64 image assets
        if: env.BOOK_CONTENT_OS_DRIVE_ZIPS_DOWNLOADED == '0'
        run: node scripts/decode-book-content-os-base64-assets.mjs

      - name: Build one Pinterest pin, one Facebook carousel, one Pinterest video and one YouTube Short
        run: node scripts/build-book-content-os-pin-and-fb-carousel.mjs

      - name: Upload generated Book Content OS social artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-content-os-social-${{ env.DATE_OVERRIDE }}
          path: |
            social/book-content-os/${{ env.DATE_OVERRIDE }}/**/*
          if-no-files-found: warn

      - name: Commit generated Book Content OS social assets before posting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/book-content-os
          if git diff --cached --quiet; then
            echo "No pre-post Book Content OS social assets to commit."
          else
            git commit -m "Save Book Content OS social assets for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
              git pull --rebase origin main
            done
            git push
          fi

      - name: Post or prepare Pinterest pin and Facebook carousel
        continue-on-error: true
        run: node scripts/post-book-content-os-pin-and-fb-carousel.mjs
        env:
          BOOK_CONTENT_OS_SOCIAL_POST_MODE: ${{ env.BOOK_CONTENT_OS_SOCIAL_POST_MODE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

      - name: Post or prepare Pinterest video
        continue-on-error: true
        run: node scripts/post-book-content-os-pinterest-video.mjs
        env:
          BOOK_CONTENT_OS_PINTEREST_VIDEO_POST_MODE: ${{ env.BOOK_CONTENT_OS_PINTEREST_VIDEO_POST_MODE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Post or prepare YouTube Short
        continue-on-error: true
        run: node scripts/post-book-content-os-youtube-short.mjs
        env:
          YOUTUBE_POST_MODE: ${{ env.YOUTUBE_POST_MODE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}

      - name: Commit generated Book Content OS social records
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/book-content-os
          if git diff --cached --quiet; then
            echo "No Book Content OS social output changes to commit."
          else
            git commit -m "Build Book Content OS pin, carousel and video for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; rebasing onto origin/main and retrying."
              git pull --rebase origin main
            done
            git push
          fi
