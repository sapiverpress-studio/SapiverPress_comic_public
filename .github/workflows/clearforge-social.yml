name: Clearforge Social Distribution

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional Clearforge date YYYY-MM-DD"
        required: false
        default: ""
        type: string
      post_mode:
        description: "Choose whether to build, verify credentials, or publish"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - verify
          - live
  repository_dispatch:
    types:
      - clearforge_publish
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  clearforge-social:
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether this run should execute
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_TIME="$(TZ=Europe/London date +%H:%M)"
          echo "Europe/London local time: ${LOCAL_TIME}"
          if [ "${LOCAL_TIME}" = "06:00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout distribution repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set run options
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            DATE_VALUE="${{ github.event.client_payload.date }}"
            MODE="live"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date_override }}" ]; then
            DATE_VALUE="${{ github.event.inputs.date_override }}"
            MODE="${{ github.event.inputs.post_mode }}"
          else
            DATE_VALUE="$(TZ=Europe/London date +%F)"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              MODE="live"
            else
              MODE="${{ github.event.inputs.post_mode }}"
            fi
          fi

          if [ -z "${DATE_VALUE}" ]; then
            DATE_VALUE="$(TZ=Europe/London date +%F)"
          fi

          echo "DATE_OVERRIDE=${DATE_VALUE}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_POST_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_EVENT_NAME=${{ github.event_name }}" >> "$GITHUB_ENV"

      - name: Ensure FFmpeg is available
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Pull approved Clearforge bundle
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/clearforge
          git clone --depth 1 "https://github.com/sapiverpress-studio/Clearforge.git" vendor/clearforge

          DATE_DIR="vendor/clearforge/bridge/clearforge/${DATE_OVERRIDE}"
          LATEST_DIR="vendor/clearforge/bridge/clearforge/latest"

          if [ -f "${DATE_DIR}/manifest.json" ]; then
            echo "CLEARFORGE_BUNDLE_ROOT=${DATE_DIR}" >> "$GITHUB_ENV"
          elif [ "${CLEARFORGE_EVENT_NAME}" = "workflow_dispatch" ] && [ -f "${LATEST_DIR}/manifest.json" ]; then
            echo "::warning::No approved bundle for ${DATE_OVERRIDE}; manual run is using latest approved Clearforge bundle."
            echo "CLEARFORGE_BUNDLE_ROOT=${LATEST_DIR}" >> "$GITHUB_ENV"
          else
            echo "::error::No approved Clearforge bundle for ${DATE_OVERRIDE}. Automated runs refuse to reuse stale content."
            exit 1
          fi

      - name: Sync latest Clearforge approval flags
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APPROVAL_FILE="vendor/clearforge/drafts/${DATE_OVERRIDE}/approval.json"
          MANIFEST_FILE="${CLEARFORGE_BUNDLE_ROOT}/manifest.json"

          if [ ! -f "${APPROVAL_FILE}" ]; then
            echo "::error::Missing latest approval file: ${APPROVAL_FILE}"
            exit 1
          fi

          node - "${APPROVAL_FILE}" "${MANIFEST_FILE}" <<'NODE'
          const fs = require('fs');
          const [approvalPath, manifestPath] = process.argv.slice(2);
          const approval = JSON.parse(fs.readFileSync(approvalPath, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.approved = {
            article: approval.article_approved === true,
            facebook: approval.facebook_approved === true,
            pinterest: approval.pinterest_approved === true,
            youtube: approval.youtube_approved === true
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log('Synced approvals:', manifest.approved);
          NODE

      - name: Build Clearforge Facebook Pinterest and YouTube assets
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-clearforge-social.mjs

      - name: Upload Clearforge social artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clearforge-social-${{ env.DATE_OVERRIDE }}
          path: |
            social/clearforge/${{ env.DATE_OVERRIDE }}/**/*
          if-no-files-found: error

      - name: Post prepare or verify Clearforge social content
        if: steps.gate.outputs.run == 'true'
        run: node scripts/post-clearforge-social.mjs
        env:
          CLEARFORGE_POST_MODE: ${{ env.CLEARFORGE_POST_MODE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_API_TOKEN: ${{ secrets.PINTEREST_API_TOKEN }}
          PINTEREST_OAUTH_TOKEN: ${{ secrets.PINTEREST_OAUTH_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ${{ secrets.PINTEREST_BOARD_NAME }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
          FORCE_CLEARFORGE_POST: ${{ secrets.FORCE_CLEARFORGE_POST }}

      - name: Show Clearforge posting result
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          RESULT_FILE="social/clearforge/${DATE_OVERRIDE}/post-result.json"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE"
          else
            echo "::warning::No post-result.json was produced."
          fi

      - name: Commit Clearforge assets and posting records
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/clearforge
          if git diff --cached --quiet; then
            echo "No Clearforge social changes to commit."
          else
            git commit -m "Build Clearforge social assets for ${DATE_OVERRIDE}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase origin main
            done
            git push
          fi
