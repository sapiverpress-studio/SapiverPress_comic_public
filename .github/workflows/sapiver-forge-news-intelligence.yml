name: AI Inquisitive Parents Social Poster

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Project date (YYYY-MM-DD). Leave blank for today in Europe/London.
        required: false
        type: string
  push:
    branches:
      - feature/news-intelligence-secondary-output
    paths:
      - '.github/workflows/sapiver-forge-news-intelligence.yml'
      - 'scripts/build-news-intelligence-social.mjs'

permissions:
  contents: write

concurrency:
  group: ai-inquisitive-parents-social
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install image dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund sharp@0.34.2
      - name: Syntax check
        run: node --check scripts/build-news-intelligence-social.mjs
      - name: Stop after branch test
        if: github.event_name == 'push'
        run: echo "Feature-branch syntax test complete; live bridge consumption is skipped."
      - name: Resolve project date
        id: edition
        if: github.event_name != 'push'
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.edition_date }}
        run: |
          set -euo pipefail
          DATE="${REQUESTED_DATE:-$(TZ=Europe/London date +%F)}"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "DATE_OVERRIDE=$DATE" >> "$GITHUB_ENV"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Pull dated AI Inquisitive Parents project
        id: bridge
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/sapiver-forge
          git clone --depth 1 https://github.com/sapiverpress-studio/SapiverForge.git vendor/sapiver-forge
          node <<'NODE'
          const fs=require('fs');
          const path='vendor/sapiver-forge/parents-projects/manifest.json';
          if(!fs.existsSync(path)) throw new Error('AI Inquisitive Parents manifest is missing.');
          const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
          const project=(manifest.projects||[]).find(item=>item.status==='ready'&&item.published_date===process.env.DATE_OVERRIDE);
          if(!project) throw new Error(`No ready AI Inquisitive Parents project exists for ${process.env.DATE_OVERRIDE}.`);
          if(!project.poster_art) throw new Error('The dated project has no poster artwork.');
          NODE
          echo "SAPIVER_FORGE_ROOT=vendor/sapiver-forge" >> "$GITHUB_ENV"
      - name: Build TikTok social package
        if: github.event_name != 'push'
        run: node scripts/build-news-intelligence-social.mjs
      - name: Verify output remains human-gated
        if: github.event_name != 'push'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const date=process.env.DATE_OVERRIDE;
          const root=`social/ai-inquisitive-parents/${date}`;
          const manifest=JSON.parse(fs.readFileSync(`${root}/manifest.json`,'utf8'));
          if(manifest.posting_allowed!==false||manifest.human_approval_required!==true) throw new Error('Human approval contract missing.');
          if(!fs.existsSync(`${root}/tiktok-poster.png`)) throw new Error('TikTok poster missing.');
          if(!fs.existsSync(`${root}/tiktok-caption.txt`)) throw new Error('TikTok caption missing.');
          NODE
      - name: Commit social package
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sapiver-parents-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "social/ai-inquisitive-parents/${DATE_OVERRIDE}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build AI Inquisitive Parents social package ${DATE_OVERRIDE} [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
      - name: Upload phone-ready package
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ai-inquisitive-parents-${{ steps.edition.outputs.date }}-${{ github.run_number }}
          path: social/ai-inquisitive-parents/${{ steps.edition.outputs.date }}/
          retention-days: 14
          if-no-files-found: error
