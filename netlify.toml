# Netlify preview dashboard disabled to stop build-minute/credit burn.
# Daily assets are generated by GitHub Actions and downloaded from GitHub artifacts/repo instead.

[build]
  command = "mkdir -p netlify-disabled && printf 'Netlify preview disabled. Download generated assets from GitHub Actions artifacts or the social/ folder in the repo.\n' > netlify-disabled/index.html"
  publish = "netlify-disabled"

[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"
